generations:
  - name: "First Generation (NHP10)"
    start_year: 2011
    end_year: 2015
    description: "The first-generation Toyota Aqua (NHP10), marketed as Prius c internationally, was unveiled at the 2011 Tokyo Motor Show as Toyota's most affordable hybrid vehicle. Built on a modified Yaris platform with compact dimensions (3,995mm length), it featured Toyota's Generation 3 Hybrid Synergy Drive system with a 1.5L DOHC four-cylinder VVT-i gasoline engine (54 kW/74 PS) paired with a 45 kW electric motor. Combined system output was 73 kW (100 PS), achieving fuel efficiency of 35.4 km/L (JC08 cycle). The pre-facelift model established the Aqua's reputation for urban mobility excellence."

  - name: "First Generation (NHP10) Facelift"
    start_year: 2015
    end_year: 2017
    description: "The December 2014 facelift introduced updated exterior styling with a more aggressive front bumper, revised headlights, and updated interior materials. The significant addition was the X-URBAN variant, a crossover-inspired version with increased ground clearance, protective body cladding, and rugged styling elements. This variant expanded the Aqua's appeal to customers seeking a more adventurous aesthetic while maintaining the core hybrid efficiency. Equipment levels were enhanced across all trim lines."

  - name: "First Generation (NHP10) Second Facelift"
    start_year: 2017
    end_year: 2020
    description: "The June 2017 second facelift brought significant styling updates including a redesigned front fascia, new LED headlights, updated grille, and revised rear bumper. The X-URBAN variant was completely redesigned and renamed Aqua Crossover, featuring more pronounced crossover styling with distinctive wheel arch moldings, roof rails, and rugged bumper designs. Interior updates included improved infotainment system, enhanced materials, and updated instrument cluster. The model continued to offer the same proven hybrid powertrain with exceptional fuel efficiency."

  - name: "Second Generation (XP210)"
    start_year: 2021
    end_year: 2025
    description: "The second-generation Toyota Aqua (XP210), unveiled July 19, 2021, represented a major technological advancement built on Toyota's GA-B platform shared with the XP210 Yaris. The wheelbase was extended by 50mm while maintaining the compact width for Japanese regulations. The landmark feature was the world's first high-output bipolar nickel-metal hydride battery in a production vehicle, delivering twice the output of the previous generation's battery. Initial grades included B, X, G, and Z, with enhanced accelerator responsiveness and expanded electric-only driving capability. The powertrain combined a 1.5L Dynamic Force engine with Toyota's latest hybrid system."

  - name: "Second Generation (XP210) Facelift"
    start_year: 2025
    end_year: null
    description: "The September 2025 mid-cycle facelift introduced updated exterior styling including the distinctive hammerhead grille design, slim LED headlights with unique center lamp on some trims, and refreshed bumper designs. Safety technology advanced with the latest Toyota Safety Sense featuring Proactive Driving Assist for improved steering and braking support involving pedestrians, cyclists, or stationary objects. New features included front and rear dash cameras, ETC 2.0 compatibility, Blind Spot Monitor, and Panoramic View Monitor. A new subscription-only 'U' grade was introduced under the KINTO service. The GR Sport performance variant, added in November 2022, continued to offer sportier styling and handling."